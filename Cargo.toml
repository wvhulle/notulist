[workspace]
resolver = "2"
members = ["notulist-client", "notulist-daemon", "notulist-ime", "notulist-whisper-sys"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wvhulle/notulist"

[workspace.dependencies]
notulist-client = { path = "notulist-client" }
notulist-whisper-sys = { path = "notulist-whisper-sys" }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 1
