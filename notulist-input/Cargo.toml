[package]
name = "notulist-input"
description = "Wayland input method that types notulist dictation and shows a phase indicator at the text cursor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notulist-client.workspace = true
clap.workspace = true
dirs.workspace = true
futures-util.workspace = true
libc.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true
ab_glyph = "0.2"
calloop = "0.14"
calloop-wayland-source = "0.4"
evdev = "0.13.2"
tiny-skia = "0.11"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
